name: Release CI
on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
  
env:
  UV_SYSTEM_PYTHON: 1
jobs:
  macos-latest:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Upgrade pip and install build dependencies
        run: |
          uv pip install --upgrade pip
          uv pip install maturin build twine
      - name: Build wheel (macOS)
        uses: PyO3/maturin-action@v1
        with:
          args: --release --target universal2-apple-darwin --out dist

      - name: List wheels
        run: ls -lh dist/

      - name: Install wheel (macOS)
        run: uv pip install --force-reinstall dist/*.whl

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ github.job }}-universal-${{ matrix.python-version }}
          path: dist
  windows-latest:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.target }}

      - name: Install vcpkg & OpenSSL
        run: |
          git clone https://github.com/Microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          if ($env:matrix_target -eq "x64") {
            C:\vcpkg\vcpkg.exe install openssl:x64-windows
            echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          else {
            C:\vcpkg\vcpkg.exe install openssl:x86-windows
            echo "OPENSSL_DIR=C:\vcpkg\installed\x86-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          echo "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "OPENSSL_NO_VENDOR=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --interpreter python${{ matrix.python-version }} --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ github.job }}-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist
  linux-latest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        target: [x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Find openssl.pc
        run: |
          find /usr -name "openssl.pc"
          pkg-config --libs --cflags openssl

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build x86_64 Wheels
        uses: PyO3/maturin-action@v1
        env:
          PKG_CONFIG_PATH: /usr/lib64/pkgconfig
          OPENSSL_DIR: /usr
          OPENSSL_INCLUDE_DIR: /usr/include
          OPENSSL_LIB_DIR: /usr/lib64
          OPENSSL_NO_VENDOR: "1"
          PYO3_STATIC_LIB: "1"
        with:
          docker-options: |
            -e PKG_CONFIG_PATH=/usr/lib64/pkgconfig
            -e OPENSSL_DIR=/usr
            -e OPENSSL_INCLUDE_DIR=/usr/include
            -e OPENSSL_LIB_DIR=/usr/lib64
            -e OPENSSL_NO_VENDOR=1
            -e PYO3_STATIC_LIB=1
          before-script-linux: |
            yum install -y openssl-devel pkgconfig
            rustc --version
            find /usr -name "openssl.pc"
            find /usr -name "opensslconf.h" 2>/dev/null
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --interpreter python${{ matrix.python-version }} --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ github.job }}-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist
  linux-latest-aarch64:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build aarch64 Wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          manylinux: auto
          before-script-linux: |
            apt-get update && apt-get install -y libssl-dev pkg-config
            rustc --version
          args: --release --interpreter python${{ matrix.python-version }} --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-latest-aarch64-${{ matrix.python-version }}
          path: dist
  linux-latest-armv7:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build armv7 Wheels
        uses: PyO3/maturin-action@v1
        with:
          target: armv7
          manylinux: auto
          before-script-linux: |
            apt-get update && apt-get install -y libssl-dev pkg-config
            rustc --version
          args: --release --interpreter python${{ matrix.python-version }} --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-latest-armv7-${{ matrix.python-version }}
          path: dist
  merge:
    name: Building Single Artifact
    runs-on: ubuntu-latest
    needs: [macos-latest, windows-latest, linux-latest, linux-latest-aarch64, linux-latest-armv7]
    steps:
      - name: Downloading all Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wheels-*
          merge-multiple: true
      - run: |
          echo "Listing directories"
          ls -R
      - name: Uploading Artifact's Bundle
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: artifacts
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [macos-latest, windows-latest, linux-latest, linux-latest-aarch64, linux-latest-armv7, merge]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Publish to PyPi
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          uv pip install --upgrade twine
          twine upload --skip-existing *